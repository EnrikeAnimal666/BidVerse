<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BidVerse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,900;1,9..144,500;1,9..144,900&display=swap">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="tick"><div id="mq"></div></div>
<div class="wrap">
<h1>Bid<i>Verse</i><sup>●</sup></h1>
<p class="sub">Cada paleta tiene $20 · hasta 3 lotes · el poder de cada personaje es secreto</p>

<div id="menu"><ul class="cats">
<li><button class="cat" onclick="start('anime')"><span class="no">01</span><span class="tt">Anime</span><span class="ds">Goku, Naruto, Luffy…</span><span class="ar">→</span></button></li>
<li><button class="cat" disabled><span class="no">02</span><span class="tt">UFC</span><span class="ds">Próximamente</span><span class="ar">·</span></button></li>
<li><button class="cat" disabled><span class="no">03</span><span class="tt">Fútbol</span><span class="ds">Próximamente</span><span class="ar">·</span></button></li>
</ul></div>

<div class="game" id="game">
<button class="back" onclick="toMenu()">← Menú</button>
<div class="board">
<div id="P1"></div>
<div class="mid">
<div class="lot" id="lot">
<div class="hd"><span>Lote <span id="cnt"></span></span><span id="catn"></span></div>
<div class="pic" id="pic"></div>
<div class="nm" id="nm"></div>
<div class="from" id="fr"></div>
<div class="pr"><div><small>Última puja</small><b id="bid">—</b></div><div class="who" id="who"></div></div>
</div>
<div class="clock" id="barw"><b id="tm"></b><div class="bar"><i id="bar"></i></div></div>
<div class="info" id="info"></div>
</div>
<div id="P2"></div>
</div>
<div class="end" id="end"></div>
</div>
</div>

</body></html>
