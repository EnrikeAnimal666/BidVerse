<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidVerse Park Spot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
  :root { --bg: #0b0a10; --ink: #f3e6c8; --mut: #9a9aa3; --acc: #9b5cff; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 600 15px Nunito, system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  #stage canvas { height: min(78vh, 1920px); width: auto; display: block; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); background: #000; max-width: calc(100vw - 32px); }
  .bar { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  button { font: 800 15px Nunito; background: var(--acc); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--acc); }
  #tc { font: 700 14px ui-monospace, monospace; color: var(--mut); min-width: 64px; text-align: right; }
  #msg { color: var(--mut); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"></div>
  <div class="bar"><button id="play">▶ Reproducir</button><input id="seek" type="range" min="0" max="32" step="0.0333" value="0"><span id="tc">0.00</span></div>
  <div id="msg">Cargando…</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import { init } from './src/park.js';
const msg = document.getElementById('msg');
try {
  const S = await init(document.getElementById('stage'));
  window.SPOT = S;
  const seek = document.getElementById('seek'), tc = document.getElementById('tc'), btn = document.getElementById('play');
  const q = new URLSearchParams(location.search);
  let t = parseFloat(q.get('t') || '0'), playing = false, actx, src, start0, buf;
  const show = async x => { t = x; await S.frame(t); seek.value = t; tc.textContent = t.toFixed(2); };
  show(t);
  msg.textContent = 'Listo. Pulsa reproducir (en directo, puede ir algo más lento que el MP4 final).';
  seek.oninput = () => { if (playing) stop(); show(parseFloat(seek.value)); };
  function stop() { playing = false; btn.textContent = '▶ Reproducir'; try { src && src.stop(); } catch {} }
  btn.onclick = () => { if (playing) return stop(); playing = true; btn.textContent = '❚❚ Pausa'; const st = performance.now() - t * 1000;
    const loop = async () => { if (!playing) return; const now = (performance.now() - st) / 1000; if (now >= S.DUR) { stop(); return; } await S.frame(now); seek.value = now; tc.textContent = now.toFixed(2); requestAnimationFrame(loop); }; loop(); };
  console.log('faltan clips:', S.missing.join(',') || 'ninguno', '| sin foto:', S.noImg.join(',') || 'ninguno');
  window.SPOT_READY = true;
} catch (e) { msg.textContent = 'Error: ' + e.message; console.error(e); window.SPOT_ERROR = String(e && e.stack || e); }
</script>
</body>
</html>
