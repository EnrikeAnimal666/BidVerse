# Ejecuta todas las pruebas en cada push y en cada pull request.
# Base de datos: SQLite temporal (los tests borran DATABASE_URL), así que no hace falta instalar nada ni ninguna clave.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24'] # 22 = la versión de Render (render.yaml)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pruebas
        run: npm test
        working-directory: server
